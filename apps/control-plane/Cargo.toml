[package]
name = "echlub-control-plane"
version.workspace = true
edition.workspace = true

[lib]
name = "echlub_control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
echlub-model = { workspace = true }
echlub-protocol = { workspace = true }
echlub-session = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
